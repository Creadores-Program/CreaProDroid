name: Build CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'GithubResources/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'GithubResources/**'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true  

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Perms Gradle
        run: chmod 777 gradlew
      - name: Set Key
        run: echo "${{ secrets.CREAPRODROIDKEYAPPB }}" | base64 -d > app/CreaProDroid.keystore
      - name: Build App
        env:
          CREAPRODROIDKEYCONTREAPP: ${{ secrets.CREAPRODROIDKEYCONTREAPP }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test App
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 16
          target: default
          arch: x86
          profile: Nexus 4
          script: |
            adb wait-for-device
            if [ "${{ github.event_name }}" = "release" ]; then adb install "app/build/outputs/apk/release/app-release.apk"; else adb install "app/build/outputs/apk/debug/app-debug.apk"; fi
            chmod +x ./tests/test-app.sh
            ./tests/test-app.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'release' && 'CreaProDroidApp-Release' || 'CreaProDroidApp-Debug' }}
          path: ${{ github.event_name == 'release' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Sync FDroid Repo
        if: github.event_name == 'release'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FDROID_SYNC }}
          repository: Creadores-Program/CreaProFDR
          event-type: app_updated
